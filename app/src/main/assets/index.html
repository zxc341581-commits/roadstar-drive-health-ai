<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Drive Health AI</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="engine.js"></script>
  <script defer src="forecast.js"></script>
  <script defer src="garage.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
<div class="shell">
  <aside>
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><path d="M7 21h3l3-10 5 11 3-8h4M7 26h18"/></svg>
      <span>Drive Health AI</span>
    </div>
    <nav aria-label="앱 메뉴">
      <button type="button" data-page="overview" class="on" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4v16h18M6 15l4-4 4 2 6-6"/></svg><span>주행 분석</span>
      </button>
      <button type="button" data-page="parts">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 9 5-9 5-9-5zM3 12l9 5 9-5M3 16l9 5 9-5"/></svg><span>소모품 관리</span>
      </button>
      <button type="button" data-page="progress">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c-3 0-6 1-8 2v12c2-1 5-2 8-1 3-1 6 0 8 1V5c-2-1-5-2-8-2zm0 0v13M7 8h2m6 0h2m-10 4h2m6 0h2"/></svg><span>운전 코칭</span>
      </button>
      <button type="button" data-page="vehicle">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 11 2-5h12l2 5M4 11h16l1 2v5H3v-5zM5 18v2m14-2v2M6 14h2m8 0h2"/></svg><span>차량 데이터</span>
      </button>
      <button type="button" data-page="budget">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 8V6H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h15v-5M3 8l16 0a2 2 0 0 1 2 2v5h-5a2 2 0 0 1 0-4h5"/></svg><span>정비 예산</span>
      </button>
    </nav>
  </aside>
  <main>
    <header>
      <span id="crumb">차량 관리</span>
      <div class="header-controls">
        <span class="pill" id="source">시뮬레이션 데이터</span>
        <button type="button" class="button theme-toggle" id="theme-toggle" aria-label="야간 테마" aria-pressed="false">
          <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15.5A8.6 8.6 0 0 1 8.5 4 8.6 8.6 0 1 0 20 15.5Z"/></svg>
          <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2"/></svg>
          <span>야간</span>
        </button>
      </div>
    </header>
    <div id="content"></div>
  </main>
</div>
</body>
</html>
